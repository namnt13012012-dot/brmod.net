 body {

   min-height: 100vh;

 .bg-ambient {
   position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
 }
 .orb {
   position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.25;
   animation: orbFloat 25s ease-in-out infinite alternate;
 }
 .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(0,240,255,0.2), transparent 70%); top: -150px; left: -100px; }

 @keyframes orbFloat {
   0% { transform: translate(0, 0) scale(1); }
   50% { transform: translate(40px, -30px) scale(1.1); }
   100% { transform: translate(-30px, 40px) scale(0.95); }
 }
 .bg-grid {
   position: fixed; inset: 0; z-index: 0;
   background-image: linear-gradient(rgba(0,240,255,0.025) 1px, transparent 1px),

   background-size: 50px 50px; opacity: 0.35;
   animation: gridMove 30s linear infinite; pointer-events: none;
 }
 @keyframes gridMove { 0% { transform: translate(0,0); } 100% { transform: translate(50px,50px); } }

 }
