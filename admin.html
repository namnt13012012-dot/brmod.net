<style>
:root { --cyan:#00f0ff; --gold:#ffd000; --bg:#02040f; }
* { margin:0; padding:0; box-sizing:border-box; font-family:system-ui; }
body { background:radial-gradient(ellipse at top, #1a1042 0%, var(--bg) 60%); min-height:100vh; display:flex; align-items:center; justify-content:center; color:#fff; padding:2rem; }
.box { background:rgba(0,0,0,0.5); border:1px solid rgba(0,240,255,0.25); border-radius:20px; padding:3rem; max-width:500px; width:100%; text-align:center; backdrop-filter:blur(12px); }
h1 { color:var(--cyan); margin-bottom:1rem; }
p { color:#aaa; margin-bottom:2rem; line-height:1.6; }
.link { display:inline-block; padding:14px 2rem; background:linear-gradient(135deg, var(--cyan), #9d4edd); color:#fff; text-decoration:none; border-radius:10px; font-weight:bold; transition:transform 0.2s; }
.link:hover { transform:scale(1.05); }
.note { margin-top:2rem; font-size:0.9rem; color:#666; }
</style>
</head>
