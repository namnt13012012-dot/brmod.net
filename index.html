<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRMOD — Hologram Universe</title>
<style>
:root {
  --holo-cyan: #00e5ff;
  --holo-magenta: #ff00e5;
  --holo-violet: #8b5cf6;
  --bg-deep: #020617;
  --glow-cyan: 0 0 12px rgba(0,229,255,0.6), 0 0 40px rgba(0,229,255,0.2);
  --glow-magenta: 0 0 12px rgba(255,0,229,0.6), 0 0 40px rgba(255,0,229,0.2);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg-deep);
  color: #fff;
  font-family: 'Segoe UI', system-ui, sans-serif;
  overflow-x: hidden;
}
#universe {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  z-index: 0;
}
.scanlines {
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(transparent, transparent 2px, rgba(0,229,255,0.03) 2px, rgba(0,229,255,0.03) 4px);
  pointer-events: none;
  z-index: 2;
}
.content {
  position: relative;
  z-index: 3;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh;
  padding: 2rem;
}
.holo-title {
  font-size: clamp(2.5rem, 7vw, 4.5rem);
  font-weight: 800;
  background: linear-gradient(135deg, var(--holo-cyan), var(--holo-violet), var(--holo-magenta));
  -webkit-background-clip: text;
  color: transparent;
  text-shadow: var(--glow-cyan);
  animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; }
  50% { opacity: 0.8; }
}
.holo-card {
  background: rgba(0,229,255,0.05);
  border: 1px solid rgba(0,229,255,0.25);
  border-radius: 16px;
  padding: 2.5rem;
  margin-top: 3rem;
  backdrop-filter: blur(12px);
  box-shadow: var(--glow-cyan);
  max-width: 450px; width: 100%;
  transition: transform 0.3s, box-shadow 0.3s;
}
.holo-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--glow-cyan), inset 0 0 20px rgba(0,229,255,0.1);
}
.holo-input {
  width: 100%;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(0,229,255,0.35);
  border-radius: 8px;
  padding: 14px 18px;
  color: #fff;
  font-size: 1rem;
  margin: 1rem 0;
  outline: none;
  transition: border 0.3s, box-shadow 0.3s;
}
.holo-input:focus {
  border-color: var(--holo-cyan);
  box-shadow: var(--glow-cyan);
}
.holo-btn {
  width: 100%;
  padding: 14px;
  border-radius: 8px;
  border: none;
  font-size: 1rem; font-weight: 600;
  cursor: pointer;
  background: linear-gradient(135deg, var(--holo-cyan), var(--holo-violet));
  color: #fff;
  box-shadow: var(--glow-cyan);
  transition: transform 0.2s, box-shadow 0.2s;
}
.holo-btn:hover {
  transform: scale(1.03);
  box-shadow: 0 0 20px rgba(0,229,255,0.7);
}
.key-display {
  margin-top: 1.5rem;
  padding: 1rem;
  background: rgba(0,229,255,0.08);
  border-radius: 8px;
  font-family: monospace;
  font-size: 1.1rem;
  color: var(--holo-cyan);
  word-break: break-all;
  display: none;
}
.expire-note {
  margin-top: 0.5rem;
  font-size: 0.85rem;
  color: #888;
}
.nav-links {
  position: fixed;
  top: 2rem; right: 2rem;
  z-index: 10;
}
.nav-links a {
  color: var(--holo-cyan);
  text-decoration: none;
  margin-left: 1.5rem;
  font-weight: 500;
  transition: color 0.2s;
}
.nav-links a:hover { color: var(--holo-magenta); }
</style>
</head>
<body>

<canvas id="universe"></canvas>
<div class="scanlines"></div>

<nav class="nav-links">
  <a href="#home">Trang chủ</a>
  <a href="/admin">Admin Panel</a>
</nav>

<div class="content">
  <h1 class="holo-title">BRMOD UNIVERSE</h1>
  <p style="color:#aaa; margin-top:0.5rem;">Hệ thống khóa kích hoạt — An toàn & Tốc độ</p>

  <div class="holo-card">
    <h3>🔑 Nhận Key Kích Hoạt</h3>
    <input type="text" id="userInput" class="holo-input" placeholder="Nhập Mã / Email / ID...">
    <button class="holo-btn" onclick="requestKey()">Yêu Cầu Key</button>
    <div id="keyBox" class="key-display">
      <strong>Key của bạn:</strong><br>
      <span id="keyValue"></span>
      <p class="expire-note">Hết hạn: <span id="expireTime"></span></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
<script>
// === Hiệu ứng Vũ trụ 3D ===
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('universe'), antialias: true, alpha: true});
renderer.setSize(window.innerWidth, window.innerHeight);

const starCount = 2500;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(starCount*3);
const colors = new Float32Array(starCount*3);
const palette = [
  [0, 0.9, 1],
  [0.55, 0.38, 0.96],
  [1, 0, 0.9]
];
for(let i=0; i<starCount; i++){
  const i3 = i*3;
  const r = Math.random()*200 - 100;
  const theta = Math.random()*Math.PI*2;
  const phi = Math.acos((Math.random()*2)-1);
  positions[i3] = r * Math.sin(phi) * Math.cos(theta);
  positions[i3+1] = r * Math.sin(phi) * Math.sin(theta);
  positions[i3+2] = r * Math.cos(phi);
  const c = palette[Math.floor(Math.random()*palette.length)];
  colors[i3] = c[0]; colors[i3+1] = c[1]; colors[i3+2] = c[2];
}
geometry.setAttribute('position', new THREE.BufferAttribute(positions,3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors,3));
const material = new THREE.PointsMaterial({size: 0.6, vertexColors: true, transparent: true, opacity: 0.8});
const stars = new THREE.Points(geometry, material);
scene.add(stars);
camera.position.z = 50;

function animate(){
  requestAnimationFrame(animate);
  stars.rotation.y += 0.0003;
  stars.rotation.x += 0.0001;
  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// === Yêu cầu Key ===
async function requestKey(){
  const input = document.getElementById('userInput').value.trim();
  if(!input) return alert('Vui lòng nhập thông tin!');
  
  const res = await fetch('/api/get-key.php', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({input})
  });
  const data = await res.json();
  
  if(data.success){
    document.getElementById('keyValue').textContent = data.key;
    document.getElementById('expireTime').textContent = data.expire;
    document.getElementById('keyBox').style.display = 'block';
  }else{
    alert(data.message || 'Lỗi hệ thống!');
  }
}
</script>
</body>
</html>
