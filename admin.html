<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị — KeyGuard Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        :root {
            --bg-main: #050816;
            --bg-card: #0f172a;
            --bg-soft: #1e293b;
            --accent-1: #f97316;
            --accent-2: #ef4444;
            --accent-3: #10b981;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: rgba(148, 163, 184, 0.15);
            --input-bg: #0b1220;
        }
        body {
            background: linear-gradient(145deg, #050816 0%, #0f172a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0;
        }
        header {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #f97316, #ea580c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
        }
        .brand-text h3 {
            font-size: 16px;
        }
        .brand-text p {
            font-size: 10px;
            color: var(--text-secondary);
        }
        .back-link {
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            color: var(--text-secondary);
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        .back-link:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        main {
            max-width: 720px;
            margin: 40px auto;
            padding: 0 24px;
        }
        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 36px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .panel-header {
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .panel-header h1 {
            font-size: 22px;
            color: var(--accent-1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .panel-header p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
        }
        .form-group {
            margin-bottom: 22px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #cbd5e1;
        }
        input, select, textarea {
            width: 100%;
            padding: 13px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.25s;
        }
        input:focus, select:focus {
            border-color: var(--accent-1);
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 540px) {
            .row { grid-template-columns: 1fr; }
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-1), #ea580c);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(249, 115, 22, 0.25);
        }
        .result-box {
            margin-top: 28px;
            padding: 20px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 12px;
            display: none;
        }
        .result-box.visible {
            display: block;
        }
        .result-box h4 {
            color: #6ee7b7;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .key-display {
            background: rgba(0,0,0,0.25);
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 15px;
            color: #86efac;
            word-break: break-all;
            margin-bottom: 10px;
        }
        .copy-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .copy-btn:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="brand-icon">⚙️</div>
            <div class="brand-text">
                <h3>Quản Trị Hệ Thống</h3>
                <p>KeyGuard Pro — Bảng Điều Khiển</p>
            </div>
        </div>
        <a href="index.html" class="back-link">← Quay Lại Trang Chủ</a>
    </header>

    <main>
        <div class="panel">
            <div class="panel-header">
                <h1>🔑 Tạo Khóa Truy Cập Mới</h1>
                <p>Thiết lập thông số và tạo key cho người dùng</p>
            </div>

            <form id="keyForm">
                <div class="form-group">
                    <label>Tên / Ghi chú nhận diện</label>
                    <input type="text" id="note" placeholder="VD: Key cho mod game — Thành viên A" required>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Ngày hết hạn</label>
                        <input type="date" id="expireDate">
                    </div>
                    <div class="form-group">
                        <label>Giới hạn sử dụng</label>
                        <input type="number" id="limit" placeholder="Không giới hạn" min="1">
                    </div>
                </div>

                <div class="form-group">
                    <label>Quyền truy cập</label>
                    <select id="role">
                        <option value="basic">Cơ bản — Tải tệp & lấy key</option>
                        <option value="premium">Nâng cao — Tất cả chức năng</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">
                    ✅ Tạo Khóa Ngay
                </button>
            </form>

            <div class="result-box" id="resultBox">
                <h4>✅ Khóa đã được tạo thành công</h4>
                <div class="key-display" id="keyDisplay">KG-XXXX-XXXX-XXXX</div>
                <button class="copy-btn" onclick="copyKey()">📋 Sao Chép Khóa</button>
            </div>
        </div>
    </main>

    <script>
        function generateKey() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let part1 = '', part2 = '', part3 = '';
            for (let i=0; i<4; i++) {
                part1 += chars[Math.floor(Math.random() * chars.length)];
                part2 += chars[Math.floor(Math.random() * chars.length)];
                part3 += chars[Math.floor(Math.random() * chars.length)];
            }
            return `KG-${part1}-${part2}-${part3}`;
        }

        document.getElementById('keyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newKey = generateKey();
            document.getElementById('keyDisplay').textContent = newKey;
            document.getElementById('resultBox').classList.add('visible');
        });

        function copyKey() {
            const keyText = document.getElementById('keyDisplay').textContent;
            navigator.clipboard.writeText(keyText).then(() => {
                alert('Đã sao chép khóa: ' + keyText);
            });
        }
    </script>
</body>
</html>
